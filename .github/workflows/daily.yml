name: Daily in-market signals

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the engine
        run: docker build -t in-market-signals .

      - name: Run the engine
        env:
          DEMO_MODE: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          LEAD_FORENSICS_API_KEY: ${{ secrets.LEAD_FORENSICS_API_KEY }}
          BOMBORA_API_KEY: ${{ secrets.BOMBORA_API_KEY }}
        run: >
          docker run --rm
          -e DEMO_MODE -e ANTHROPIC_API_KEY -e SLACK_WEBHOOK_URL
          -e HUBSPOT_TOKEN -e HF_TOKEN -e HF_DATASET_REPO
          -e LEAD_FORENSICS_API_KEY -e BOMBORA_API_KEY
          in-market-signals
